<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yu-Gi-Oh! Visual Deck Tracker</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --success: #22c55e;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
    }
    .container { max-width: 1100px; margin: 0 auto; }
    h1, h2, h3, h4 { margin: 0 0 10px 0; }
    button {
      background: var(--accent);
      color: #000;
      border: none;
      padding: 8px 12px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover { opacity: 0.9; }
    .btn-danger { background: #ef4444; color: #fff; }
    .card-box {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 20px;
    }
    .form-group { display: flex; gap: 8px; margin-bottom: 12px; }
    input, select, textarea {
      background: #0f172a;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px;
      border-radius: 4px;
      width: 100%;
    }
    
    /* Search Results Grid */
    .search-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 12px;
      max-height: 400px;
      overflow-y: auto;
      margin-top: 15px;
      padding-right: 5px;
    }
    .search-item {
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .search-item img { width: 100%; border-radius: 4px; margin-bottom: 6px; }
    .search-item span { font-size: 0.8em; font-weight: bold; margin-bottom: 6px; line-clamp: 2; display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; }

    /* Decks Layout */
    .deck-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
    .progress-bar {
      background: var(--border);
      height: 10px;
      border-radius: 5px;
      overflow: hidden;
      margin: 8px 0;
    }
    .progress-fill { background: var(--success); height: 100%; width: 0%; transition: width 0.3s; }
    
    /* Deck Card Visual Item */
    .deck-card-list { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; max-height: 350px; overflow-y: auto; }
    .deck-card-row {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #0f172a;
      padding: 6px;
      border-radius: 6px;
      border: 1px solid var(--border);
    }
    .deck-card-row img { width: 45px; height: 65px; border-radius: 3px; object-fit: cover; }
    .deck-card-info { flex-grow: 1; font-size: 0.85em; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Yu-Gi-Oh! Visual Deck Tracker</h1>
    
    <!-- API Search Bar -->
    <div class="card-box">
      <h2>Search Card Database</h2>
      <div class="form-group">
        <input type="text" id="searchInput" placeholder="Search by name or keyword (e.g. Ash Blossom, Branded)..." onkeyup="if(event.key==='Enter') searchCards()" />
        <button onclick="searchCards()">Search</button>
      </div>
      <div id="searchResults" class="search-grid"></div>
    </div>

    <!-- Create Deck Form -->
    <div class="card-box">
      <h2>Create New Deck</h2>
      <div class="form-group">
        <input type="text" id="deckName" placeholder="Deck Name (e.g. Tearlaments)" />
        <button onclick="addDeck()">Add Deck</button>
      </div>
    </div>

    <!-- Decks Display -->
    <div id="deckList" class="deck-grid"></div>
  </div>

  <script>
    let decks = JSON.parse(localStorage.getItem('ygo_visual_decks')) || [];
    let currentSearchResults = [];

    function saveDecks() {
      localStorage.setItem('ygo_visual_decks', JSON.stringify(decks));
      render();
    }

    // --- Search YGOPRODeck API ---
    async function searchCards() {
      const query = document.getElementById('searchInput').value.trim();
      const resultsContainer = document.getElementById('searchResults');
      if (!query) return;

      resultsContainer.innerHTML = '<p style="font-size: 0.9em;">Searching YGOPRODeck API...</p>';

      try {
        const response = await fetch(`https://db.ygoprodeck.com/api/v7/cardinfo.php?fname=${encodeURIComponent(query)}`);
        if (!response.ok) throw new Error('Card not found');
        
        const data = await response.json();
        currentSearchResults = data.data.slice(0, 20); // Limit to top 20 results for speed

        resultsContainer.innerHTML = currentSearchResults.map((card, idx) => `
          <div class="search-item">
            <img src="${card.card_images[0].image_url_small}" alt="${card.name}">
            <span>${card.name}</span>
            <button onclick="addCardToDeckFromSearch(${idx})" style="font-size: 0.75em; width: 100%;">+ Add</button>
          </div>
        `).join('');
      } catch (err) {
        resultsContainer.innerHTML = '<p style="color: #ef4444; font-size: 0.9em;">No cards found matching keyword.</p>';
      }
    }

    // --- Deck Operations ---
    function addDeck() {
      const nameInput = document.getElementById('deckName');
      if (!nameInput.value.trim()) return;
      
      decks.push({
        id: Date.now(),
        name: nameInput.value.trim(),
        cards: [],
        augmentations: ''
      });
      nameInput.value = '';
      saveDecks();
    }

    function deleteDeck(id) {
      decks = decks.filter(d => d.id !== id);
      saveDecks();
    }

    function addCardToDeckFromSearch(searchIdx) {
      if (decks.length === 0) {
        alert("Please create a deck first!");
        return;
      }

      const cardData = currentSearchResults[searchIdx];
      let deckOptions = decks.map((d, i) => `${i + 1}. ${d.name}`).join('\n');
      let chosenDeckIdx = prompt(`Choose deck to add "${cardData.name}" to:\n${deckOptions}`, "1");
      
      if (!chosenDeckIdx || isNaN(chosenDeckIdx)) return;
      let targetDeck = decks[parseInt(chosenDeckIdx) - 1];

      if (!targetDeck) return;

      let type = prompt("Deck section (Main / Extra / Side):", cardData.type.includes("Fusion") || cardData.type.includes("Synchro") || cardData.type.includes("XYZ") || cardData.type.includes("Link") ? "Extra" : "Main");
      let needed = parseInt(prompt("Total Copies Needed:", "3")) || 1;
      let acquired = parseInt(prompt("Copies Acquired:", "0")) || 0;

      targetDeck.cards.push({
        id: Date.now(),
        name: cardData.name,
        type: type || "Main",
        image: cardData.card_images[0].image_url_small,
        needed,
        acquired
      });

      saveDecks();
    }

    function updateCardAcquired(deckId, cardId, change) {
      const deck = decks.find(d => d.id === deckId);
      const card = deck.cards.find(c => c.id === cardId);
      card.acquired = Math.max(0, Math.min(card.needed, card.acquired + change));
      saveDecks();
    }

    function updateAugmentations(deckId, text) {
      const deck = decks.find(d => d.id === deckId);
      deck.augmentations = text;
      localStorage.setItem('ygo_visual_decks', JSON.stringify(decks));
    }

    // --- Rendering ---
    function render() {
      const container = document.getElementById('deckList');
      container.innerHTML = '';

      decks.forEach(deck => {
        let mainCount = 0, extraCount = 0, sideCount = 0;
        let totalNeeded = 0, totalAcquired = 0;

        deck.cards.forEach(c => {
          if (c.type.toLowerCase() === 'extra') extraCount += c.needed;
          else if (c.type.toLowerCase() === 'side') sideCount += c.needed;
          else mainCount += c.needed;

          totalNeeded += c.needed;
          totalAcquired += c.acquired;
        });

        const progressPercent = totalNeeded > 0 ? Math.round((totalAcquired / totalNeeded) * 100) : 0;

        const deckEl = document.createElement('div');
        deckEl.className = 'card-box';
        deckEl.innerHTML = `
          <h3>${deck.name}</h3>
          <p style="font-size: 0.85em; color: var(--text-muted);">
            Main: ${mainCount} | Extra: ${extraCount} | Side: ${sideCount}
          </p>
          <div>
            <small>Build Progress: ${totalAcquired}/${totalNeeded} cards (${progressPercent}%)</small>
            <div class="progress-bar">
              <div class="progress-fill" style="width: ${progressPercent}%"></div>
            </div>
          </div>

          <h4>Deck List</h4>
          <div class="deck-card-list">
            ${deck.cards.map(c => `
              <div class="deck-card-row">
                <img src="${c.image}" alt="${c.name}">
                <div class="deck-card-info">
                  <strong>[${c.type}] ${c.name}</strong><br>
                  <small>Acquired: ${c.acquired} / ${c.needed}</small>
                </div>
                <div>
                  <button onclick="updateCardAcquired(${deck.id}, ${c.id}, 1)">+</button>
                  <button onclick="updateCardAcquired(${deck.id}, ${c.id}, -1)">-</button>
                </div>
              </div>
            `).join('')}
          </div>

          <div style="margin-top: 15px;">
            <h4>Suggested Augmentations</h4>
            <textarea placeholder="e.g. Side in Nibiru for going second..." 
              onchange="updateAugmentations(${deck.id}, this.value)">${deck.augmentations || ''}</textarea>
          </div>

          <button class="btn-danger" style="margin-top: 15px; width: 100%;" onclick="deleteDeck(${deck.id})">Delete Deck</button>
        `;
        container.appendChild(deckEl);
      });
    }

    render();
  </script>
</body>
</html>
