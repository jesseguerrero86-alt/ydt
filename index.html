<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yu-Gi-Oh! Deck Tracker & Database</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Rajdhani:wght@500;600;700&display=swap');

    :root {
      --bg: #070a12;
      --panel-bg: rgba(15, 23, 42, 0.75);
      --card-bg: rgba(23, 32, 54, 0.85);
      --border: rgba(0, 243, 255, 0.25);
      --border-glow: rgba(0, 243, 255, 0.5);
      --neon-cyan: #00f3ff;
      --neon-purple: #b026ff;
      --neon-pink: #ff0055;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --success: #10b981;
      --danger: #ff0055;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Rajdhani', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      background-image: 
        radial-gradient(circle at 15% 20%, rgba(176, 38, 255, 0.12) 0%, transparent 40%),
        radial-gradient(circle at 85% 80%, rgba(0, 243, 255, 0.12) 0%, transparent 40%),
        linear-gradient(to bottom, #070a12, #0d1322);
      background-attachment: fixed;
      color: var(--text);
      margin: 0;
      padding: 24px 16px;
      min-height: 100vh;
    }

    .container { max-width: 1200px; margin: 0 auto; }

    h1, h2, h3, h4 {
      font-family: 'Orbitron', sans-serif;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin: 0 0 12px 0;
    }

    h1 {
      font-size: 2rem;
      text-align: center;
      color: #fff;
      text-shadow: 0 0 12px var(--neon-cyan), 0 0 24px rgba(0, 243, 255, 0.4);
      margin-bottom: 24px;
    }

    h1::after {
      content: '';
      display: block;
      width: 120px;
      height: 3px;
      background: linear-gradient(90deg, var(--neon-cyan), var(--neon-purple));
      margin: 10px auto 0 auto;
      box-shadow: 0 0 10px var(--neon-cyan);
    }

    h2 {
      font-size: 1.25rem;
      color: var(--neon-cyan);
      border-bottom: 1px solid rgba(0, 243, 255, 0.2);
      padding-bottom: 8px;
    }

    h3 { font-size: 1.1rem; color: #fff; }

    button {
      font-family: 'Orbitron', sans-serif;
      background: linear-gradient(135deg, var(--neon-cyan), #00a8ff);
      color: #050b14;
      border: none;
      padding: 9px 14px;
      font-size: 0.85rem;
      font-weight: 700;
      border-radius: 4px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: all 0.2s ease;
      box-shadow: 0 0 10px rgba(0, 243, 255, 0.3);
    }

    button:hover {
      box-shadow: 0 0 18px rgba(0, 243, 255, 0.7);
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text);
      box-shadow: none;
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.2);
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
    }

    .btn-danger {
      background: linear-gradient(135deg, var(--danger), #b91c1c);
      color: #fff;
      box-shadow: 0 0 10px rgba(255, 0, 85, 0.3);
    }

    .btn-danger:hover {
      box-shadow: 0 0 18px rgba(255, 0, 85, 0.7);
    }

    .btn-icon {
      padding: 5px 10px;
      font-size: 0.75rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .card-panel {
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 24px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      transition: border-color 0.3s;
    }

    .card-panel:hover { border-color: var(--border-glow); }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .panel-header h2 {
      margin: 0;
      border-bottom: none;
      padding-bottom: 0;
    }

    .grid-layout {
      display: grid;
      grid-template-columns: 1fr 1.1fr;
      gap: 24px;
    }

    @media (max-width: 868px) {
      .grid-layout { grid-template-columns: 1fr; }
    }

    .form-group { display: flex; gap: 10px; margin-bottom: 12px; }

    input, select, textarea {
      font-family: 'Rajdhani', sans-serif;
      font-size: 1rem;
      background: rgba(7, 10, 18, 0.85);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 6px;
      width: 100%;
      outline: none;
      transition: all 0.2s;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--neon-cyan);
      box-shadow: 0 0 10px rgba(0, 243, 255, 0.3);
    }

    /* Search Results Grid */
    .search-results {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 14px;
      max-height: 520px;
      overflow-y: auto;
      margin-top: 12px;
      padding-right: 6px;
    }

    .search-results::-webkit-scrollbar { width: 6px; }
    .search-results::-webkit-scrollbar-track { background: rgba(0,0,0,0.3); }
    .search-results::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .search-card-item {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 10px;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s, border-color 0.2s;
    }

    .search-card-item:hover {
      transform: translateY(-3px);
      border-color: var(--neon-purple);
      box-shadow: 0 0 12px rgba(176, 38, 255, 0.25);
    }

    .search-card-item img {
      width: 100%;
      border-radius: 4px;
      margin-bottom: 8px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.5);
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .search-card-item img:hover {
      opacity: 0.85;
    }

    .search-card-item span {
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 8px;
      display: block;
      color: var(--text);
      line-height: 1.2;
    }

    /* FULLSCREEN SEARCH MODAL STYLES */
    .fullscreen-search-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(5, 8, 16, 0.95);
      backdrop-filter: blur(16px);
      z-index: 900;
      display: flex;
      flex-direction: column;
      padding: 24px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .fullscreen-search-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .fullscreen-search-container {
      max-width: 1400px;
      width: 100%;
      margin: 0 auto;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .fullscreen-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
    }

    .fullscreen-header h2 {
      margin: 0;
      border-bottom: none;
      padding-bottom: 0;
      font-size: 1.5rem;
    }

    .fullscreen-search-overlay .search-results {
      max-height: none;
      flex-grow: 1;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 18px;
      padding-right: 12px;
    }

    /* CARD DETAILS MODAL STYLES */
    .card-detail-layout {
      display: grid;
      grid-template-columns: 200px 1fr;
      gap: 20px;
      align-items: start;
    }

    @media (max-width: 600px) {
      .card-detail-layout {
        grid-template-columns: 1fr;
      }
      .card-detail-img {
        max-width: 180px;
        margin: 0 auto;
      }
    }

    .card-detail-img {
      width: 100%;
      border-radius: 8px;
      box-shadow: 0 0 20px rgba(0, 243, 255, 0.3);
      border: 1px solid var(--border);
    }

    .card-detail-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 12px;
    }

    .card-detail-desc {
      font-size: 0.95rem;
      line-height: 1.5;
      color: #e2e8f0;
      background: rgba(7, 10, 18, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 12px;
      border-radius: 6px;
      max-height: 220px;
      overflow-y: auto;
      white-space: pre-wrap;
    }

    /* Deck Lists */
    .progress-bar {
      background: rgba(0, 0, 0, 0.5);
      height: 12px;
      border-radius: 6px;
      overflow: hidden;
      margin: 8px 0;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .progress-fill {
      background: linear-gradient(90deg, var(--neon-cyan), var(--success));
      height: 100%;
      width: 0%;
      transition: width 0.4s ease-out;
      box-shadow: 0 0 8px var(--success);
    }

    /* Collapsible Section Styles */
    .collapsible-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      user-select: none;
      padding: 8px 10px;
      background: rgba(0, 243, 255, 0.05);
      border: 1px solid rgba(0, 243, 255, 0.15);
      border-radius: 6px;
      transition: background 0.2s, border-color 0.2s;
    }

    .collapsible-header:hover {
      background: rgba(0, 243, 255, 0.12);
      border-color: var(--neon-cyan);
    }

    .collapsible-header h4 {
      margin: 0;
      color: var(--neon-cyan);
      font-size: 0.95rem;
    }

    .toggle-icon {
      font-size: 0.75rem;
      color: var(--neon-cyan);
      transition: transform 0.25s ease;
    }

    .collapsible-body {
      max-height: 1000px;
      overflow: hidden;
      transition: max-height 0.35s ease-in-out, opacity 0.25s ease, margin-top 0.25s ease;
      opacity: 1;
      margin-top: 10px;
    }

    .collapsible-body.collapsed {
      max-height: 0;
      opacity: 0;
      margin-top: 0;
      pointer-events: none;
    }

    .deck-card-list { display: flex; flex-direction: column; gap: 10px; }

    .deck-card-row {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(7, 10, 18, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 8px 12px;
      border-radius: 6px;
    }

    .deck-card-row img { 
      width: 38px; 
      border-radius: 3px; 
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .deck-card-row img:hover {
      opacity: 0.8;
    }

    .deck-card-info { flex-grow: 1; font-size: 0.95rem; }
    .deck-card-info strong { color: #fff; }

    .tag {
      font-size: 0.75rem;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(0, 243, 255, 0.15);
      color: var(--neon-cyan);
      border: 1px solid rgba(0, 243, 255, 0.3);
      font-family: 'Orbitron', sans-serif;
    }

    /* CUSTOM MODAL DIALOG STYLES */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(5, 8, 16, 0.85);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-box {
      background: var(--panel-bg);
      border: 1px solid var(--neon-cyan);
      box-shadow: 0 0 30px rgba(0, 243, 255, 0.3), inset 0 0 15px rgba(0, 243, 255, 0.1);
      border-radius: 12px;
      padding: 24px;
      width: 90%;
      max-width: 440px;
      transform: scale(0.9);
      transition: transform 0.25s ease;
    }

    .modal-box.large {
      max-width: 620px;
    }

    .modal-overlay.active .modal-box {
      transform: scale(1);
    }

    .modal-box h3 {
      color: var(--neon-cyan);
      font-size: 1.2rem;
      margin-bottom: 14px;
      text-shadow: 0 0 8px rgba(0, 243, 255, 0.5);
    }

    .modal-field {
      margin-bottom: 14px;
    }

    .modal-field label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 4px;
      font-family: 'Orbitron', sans-serif;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Yu-Gi-Oh! Deck Tracker</h1>

    <div class="grid-layout">
      <!-- LEFT COLUMN: CARD SEARCH -->
      <div>
        <div class="card-panel" id="searchPanel">
          <div class="panel-header">
            <h2>Database Search</h2>
            <button class="btn-secondary btn-icon" onclick="toggleFullscreenSearch()">
              <span>⛶ Expand</span>
            </button>
          </div>
          <div class="form-group">
            <input type="text" id="searchInput" placeholder="Enter card name or keyword..." onkeydown="if(event.key==='Enter') searchCards()">
            <button onclick="searchCards()">Search</button>
          </div>
          <div id="searchResults" class="search-results">
            <small style="color: var(--text-muted);">Query the YGOPRODeck API to view and add cards.</small>
          </div>
        </div>
      </div>

      <!-- RIGHT COLUMN: DECKS MANAGEMENT -->
      <div>
        <div class="card-panel">
          <h2>Create New Deck</h2>
          <div class="form-group">
            <input type="text" id="deckName" placeholder="Deck Name (e.g., Fiendsmith Snake-Eye)">
            <button onclick="addDeck()">Add Deck</button>
          </div>
        </div>

        <div id="deckList"></div>
      </div>
    </div>
  </div>

  <!-- FULLSCREEN SEARCH MODAL OVERLAY -->
  <div id="fullscreenSearchModal" class="fullscreen-search-overlay">
    <div class="fullscreen-search-container">
      <div class="fullscreen-header">
        <h2>Database Search</h2>
        <button class="btn-secondary btn-icon" onclick="toggleFullscreenSearch()">
          <span>✕ Close</span>
        </button>
      </div>
      <div class="form-group">
        <input type="text" id="fullscreenSearchInput" placeholder="Enter card name or keyword..." onkeydown="if(event.key==='Enter') searchCards(true)">
        <button onclick="searchCards(true)">Search</button>
      </div>
      <div id="fullscreenSearchResults" class="search-results">
        <small style="color: var(--text-muted);">Query the YGOPRODeck API to view and add cards.</small>
      </div>
    </div>
  </div>

  <!-- CUSTOM MODAL HTML STRUCTURE -->
  <div id="customModal" class="modal-overlay">
    <div class="modal-box" id="modalBox">
      <h3 id="modalTitle">Configure Card</h3>
      <div id="modalBody"></div>
      <div class="modal-actions" id="modalActions">
        <button class="btn-secondary" id="modalCancelBtn">Cancel</button>
        <button id="modalConfirmBtn">Confirm</button>
      </div>
    </div>
  </div>

  <script>
    let decks = JSON.parse(localStorage.getItem('ygo_decks_v2')) || [];
    let collapsedSections = JSON.parse(localStorage.getItem('ygo_collapsed_v1')) || {};
    let lastSearchResults = [];
    let isFullscreenSearchActive = false;

    function saveDecks() {
      localStorage.setItem('ygo_decks_v2', JSON.stringify(decks));
      renderDecks();
    }

    function toggleSection(sectionKey) {
      collapsedSections[sectionKey] = !collapsedSections[sectionKey];
      localStorage.setItem('ygo_collapsed_v1', JSON.stringify(collapsedSections));
      renderDecks();
    }

    // --- FULLSCREEN SEARCH TOGGLE ---
    function toggleFullscreenSearch() {
      const modal = document.getElementById('fullscreenSearchModal');
      isFullscreenSearchActive = !isFullscreenSearchActive;

      if (isFullscreenSearchActive) {
        modal.classList.add('active');
        document.getElementById('fullscreenSearchInput').value = document.getElementById('searchInput').value;
        document.getElementById('fullscreenSearchInput').focus();
      } else {
        modal.classList.remove('active');
        document.getElementById('searchInput').value = document.getElementById('fullscreenSearchInput').value;
      }

      renderSearchResults();
    }

    // Close on Escape key
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && isFullscreenSearchActive) {
        toggleFullscreenSearch();
      }
    });

    // --- CUSTOM MODAL DIALOG SYSTEM ---
    function showModal({ title, bodyHTML, confirmText = 'Confirm', isDanger = false, isLarge = false, hideConfirm = false, onConfirm }) {
      const modal = document.getElementById('customModal');
      const box = document.getElementById('modalBox');
      const titleEl = document.getElementById('modalTitle');
      const bodyEl = document.getElementById('modalBody');
      const confirmBtn = document.getElementById('modalConfirmBtn');
      const cancelBtn = document.getElementById('modalCancelBtn');

      titleEl.textContent = title;
      bodyEl.innerHTML = bodyHTML;
      confirmBtn.textContent = confirmText;
      confirmBtn.style.display = hideConfirm ? 'none' : 'inline-block';
      cancelBtn.textContent = hideConfirm ? 'Close' : 'Cancel';
      
      if (isLarge) box.classList.add('large');
      else box.classList.remove('large');

      confirmBtn.className = isDanger ? 'btn-danger' : '';

      const closeModal = () => {
        modal.classList.remove('active');
        confirmBtn.onclick = null;
        cancelBtn.onclick = null;
      };

      cancelBtn.onclick = closeModal;
      confirmBtn.onclick = () => {
        if (onConfirm && onConfirm()) {
          closeModal();
        }
      };

      modal.classList.add('active');
    }

    // --- CARD DETAIL PREVIEW MODAL ---
    async function showCardDetails(cardId, fallbackName = '') {
      let card = lastSearchResults.find(c => c.id === cardId || c.id === parseInt(cardId));
      
      if (!card) {
        // Fetch card info from API if not found in current search results
        showModal({
          title: fallbackName || 'Loading Card Details...',
          bodyHTML: '<small style="color: var(--neon-cyan);">Fetching card details from database...</small>',
          hideConfirm: true,
          isLarge: true
        });

        try {
          const queryParam = cardId ? `id=${cardId}` : `name=${encodeURIComponent(fallbackName)}`;
          const response = await fetch(`https://db.ygoprodeck.com/api/v7/cardinfo.php?${queryParam}`);
          const data = await response.json();
          card = data.data[0];
        } catch (err) {
          showModal({
            title: 'Error',
            bodyHTML: '<p style="color: var(--danger);">Failed to load card details.</p>',
            hideConfirm: true
          });
          return;
        }
      }

      if (!card) return;

      const fullImg = card.card_images[0]?.image_url || card.card_images[0]?.image_url_small || '';
      const atkDef = (card.atk !== undefined && card.def !== undefined) ? `ATK: ${card.atk} / DEF: ${card.def}` : '';
      const levelRank = card.level ? `★ Level ${card.level}` : (card.linkval ? `Link-${card.linkval}` : '');

      showModal({
        title: card.name,
        isLarge: true,
        hideConfirm: true,
        bodyHTML: `
          <div class="card-detail-layout">
            <img class="card-detail-img" src="${fullImg}" alt="${card.name}">
            <div>
              <div class="card-detail-meta">
                <span class="tag">${card.type || 'Card'}</span>
                ${card.race ? `<span class="tag">${card.race}</span>` : ''}
                ${card.attribute ? `<span class="tag">${card.attribute}</span>` : ''}
                ${card.archetype ? `<span class="tag">${card.archetype}</span>` : ''}
              </div>
              ${levelRank || atkDef ? `
                <div style="font-size: 0.9rem; margin-bottom: 10px; color: var(--neon-cyan);">
                  <strong>${levelRank}</strong> ${levelRank && atkDef ? '•' : ''} <strong>${atkDef}</strong>
                </div>
              ` : ''}
              <div class="card-detail-desc">${card.desc || 'No description available.'}</div>
            </div>
          </div>
        `
      });
    }

    // --- CARD SEARCH (YGOPRODeck API) ---
    async function searchCards(fromFullscreen = false) {
      const searchInputId = fromFullscreen ? 'fullscreenSearchInput' : 'searchInput';
      const query = document.getElementById(searchInputId).value.trim();
      
      // Sync both search inputs
      document.getElementById('searchInput').value = query;
      document.getElementById('fullscreenSearchInput').value = query;

      const resultsContainer = document.getElementById('searchResults');
      const fullscreenResultsContainer = document.getElementById('fullscreenSearchResults');

      if (!query) return;

      const loadingHTML = '<small style="color: var(--neon-cyan);">Searching database...</small>';
      resultsContainer.innerHTML = loadingHTML;
      fullscreenResultsContainer.innerHTML = loadingHTML;

      try {
        const response = await fetch(`https://db.ygoprodeck.com/api/v7/cardinfo.php?fname=${encodeURIComponent(query)}`);
        if (!response.ok) throw new Error('No cards found');
        
        const data = await response.json();
        lastSearchResults = data.data.slice(0, 40);

        renderSearchResults();
      } catch (err) {
        const noResultsHTML = '<small style="color: var(--text-muted);">No cards found matching that query.</small>';
        resultsContainer.innerHTML = noResultsHTML;
        fullscreenResultsContainer.innerHTML = noResultsHTML;
      }
    }

    function renderSearchResults() {
      const container = isFullscreenSearchActive 
        ? document.getElementById('fullscreenSearchResults') 
        : document.getElementById('searchResults');

      container.innerHTML = '';

      if (lastSearchResults.length === 0) {
        container.innerHTML = '<small style="color: var(--text-muted);">No results to display.</small>';
        return;
      }

      lastSearchResults.forEach(card => {
        const cardImg = card.card_images[0]?.image_url_small || '';
        const item = document.createElement('div');
        item.className = 'search-card-item';

        item.innerHTML = `
          <img src="${cardImg}" alt="${card.name}" onclick="showCardDetails(${card.id})" title="Click to view details">
          <span>${card.name}</span>
          ${decks.length > 0 ? `
            <button onclick="openAddCardModal(${card.id})" style="font-size:0.75rem; padding: 6px; width:100%;">+ Add</button>
          ` : '<small style="color: var(--text-muted); font-size:0.75rem;">Create a deck first</small>'}
        `;
        container.appendChild(item);
      });
    }

    // --- DECK MANAGEMENT & DIALOGS ---
    function addDeck() {
      const nameInput = document.getElementById('deckName');
      if (!nameInput.value.trim()) return;
      
      decks.push({
        id: Date.now(),
        name: nameInput.value.trim(),
        cards: [],
        augmentations: ''
      });
      nameInput.value = '';
      saveDecks();
      renderSearchResults();
    }

    function deleteDeck(id) {
      const deck = decks.find(d => d.id === id);
      showModal({
        title: 'Delete Deck',
        bodyHTML: `<p>Are you sure you want to permanently delete <strong>${deck ? deck.name : 'this deck'}</strong>?</p>`,
        confirmText: 'Delete Deck',
        isDanger: true,
        onConfirm: () => {
          decks = decks.filter(d => d.id !== id);
          delete collapsedSections[`cards_${id}`];
          delete collapsedSections[`notes_${id}`];
          localStorage.setItem('ygo_collapsed_v1', JSON.stringify(collapsedSections));
          saveDecks();
          renderSearchResults();
          return true;
        }
      });
    }

    function openAddCardModal(cardApiId) {
      const cardData = lastSearchResults.find(c => c.id === cardApiId);

      if (!cardData || decks.length === 0) return;

      const isExtra = cardData.type.includes("Extra") || cardData.type.includes("Fusion") || 
                      cardData.type.includes("Synchro") || cardData.type.includes("XYZ") || 
                      cardData.type.includes("Link");

      const defaultSection = isExtra ? "Extra" : "Main";
      const deckOptions = decks.map(d => `<option value="${d.id}">${d.name}</option>`).join('');

      showModal({
        title: `Add ${cardData.name}`,
        bodyHTML: `
          <div class="modal-field">
            <label>Target Deck</label>
            <select id="modalTargetDeck">
              ${deckOptions}
            </select>
          </div>
          <div class="modal-field">
            <label>Deck Section</label>
            <select id="modalCardType">
              <option value="Main" ${defaultSection === 'Main' ? 'selected' : ''}>Main Deck</option>
              <option value="Extra" ${defaultSection === 'Extra' ? 'selected' : ''}>Extra Deck</option>
              <option value="Side">Side Deck</option>
            </select>
          </div>
          <div class="modal-field">
            <label>Total Copies Needed</label>
            <input type="number" id="modalCardNeeded" value="3" min="1" max="99">
          </div>
          <div class="modal-field">
            <label>Copies Currently Acquired</label>
            <input type="number" id="modalCardAcquired" value="0" min="0" max="99">
          </div>
        `,
        confirmText: 'Add to Deck',
        onConfirm: () => {
          const targetDeckId = parseInt(document.getElementById('modalTargetDeck').value);
          const deck = decks.find(d => d.id === targetDeckId);
          if (!deck) return false;

          const type = document.getElementById('modalCardType').value;
          const needed = parseInt(document.getElementById('modalCardNeeded').value) || 1;
          const acquired = parseInt(document.getElementById('modalCardAcquired').value) || 0;

          deck.cards.push({
            id: Date.now(),
            apiId: cardData.id,
            name: cardData.name,
            type: type,
            img: cardData.card_images[0]?.image_url_small || '',
            needed: needed,
            acquired: acquired
          });

          // Ensure card list expands when a card is added
          collapsedSections[`cards_${deck.id}`] = false;
          localStorage.setItem('ygo_collapsed_v1', JSON.stringify(collapsedSections));

          saveDecks();
          return true;
        }
      });
    }

    function updateAcquired(deckId, cardId, delta) {
      const deck = decks.find(d => d.id === deckId);
      const card = deck.cards.find(c => c.id === cardId);
      card.acquired = Math.max(0, Math.min(card.needed, card.acquired + delta));
      saveDecks();
    }

    function removeCard(deckId, cardId) {
      const deck = decks.find(d => d.id === deckId);
      deck.cards = deck.cards.filter(c => c.id !== cardId);
      saveDecks();
    }

    function updateAugmentations(deckId, text) {
      const deck = decks.find(d => d.id === deckId);
      deck.augmentations = text;
      localStorage.setItem('ygo_decks_v2', JSON.stringify(decks));
    }

    function renderDecks() {
      const container = document.getElementById('deckList');
      container.innerHTML = '';

      decks.forEach(deck => {
        let mainCount = 0, extraCount = 0, sideCount = 0;
        let totalNeeded = 0, totalAcquired = 0;

        deck.cards.forEach(c => {
          const typeLower = c.type.toLowerCase();
          if (typeLower === 'extra') extraCount += c.needed;
          else if (typeLower === 'side') sideCount += c.needed;
          else mainCount += c.needed;

          totalNeeded += c.needed;
          totalAcquired += c.acquired;
        });

        const progressPercent = totalNeeded > 0 ? Math.round((totalAcquired / totalNeeded) * 100) : 0;
        const isCardsCollapsed = !!collapsedSections[`cards_${deck.id}`];
        const isNotesCollapsed = !!collapsedSections[`notes_${deck.id}`];

        const deckEl = document.createElement('div');
        deckEl.className = 'card-panel';
        deckEl.innerHTML = `
          <h3>${deck.name}</h3>
          <p style="font-size: 0.9rem; color: var(--text-muted); margin-bottom: 12px;">
            Main: <strong style="color:var(--neon-cyan);">${mainCount}</strong> | 
            Extra: <strong style="color:var(--neon-cyan);">${extraCount}</strong> | 
            Side: <strong style="color:var(--neon-cyan);">${sideCount}</strong>
          </p>
          <div>
            <div style="display:flex; justify-content:space-between; font-size:0.85rem;">
              <span>Build Progress</span>
              <span style="color:var(--neon-cyan);">${totalAcquired}/${totalNeeded} (${progressPercent}%)</span>
            </div>
            <div class="progress-bar">
              <div class="progress-fill" style="width: ${progressPercent}%"></div>
            </div>
          </div>

          <!-- COLLAPSIBLE CARD LIST -->
          <div style="margin-top: 16px;">
            <div class="collapsible-header" onclick="toggleSection('cards_${deck.id}')">
              <h4>Card List (${deck.cards.length})</h4>
              <span class="toggle-icon">${isCardsCollapsed ? '►' : '▼'}</span>
            </div>
            <div class="collapsible-body ${isCardsCollapsed ? 'collapsed' : ''}">
              ${deck.cards.length === 0 ? `
                <small style="color: var(--text-muted); display: block; padding: 8px 0;">No cards added to this deck yet.</small>
              ` : `
                <div class="deck-card-list">
                  ${deck.cards.map(c => `
                    <div class="deck-card-row">
                      ${c.img ? `<img src="${c.img}" onclick="showCardDetails(${c.apiId || 'null'}, '${c.name.replace(/'/g, "\\'")}')" title="Click to view details">` : ''}
                      <div class="deck-card-info">
                        <strong>${c.name}</strong> <span class="tag">${c.type}</span><br>
                        <span style="color: var(--text-muted); font-size: 0.85rem;">Acquired: ${c.acquired} / ${c.needed}</span>
                      </div>
                      <div style="display:flex; gap: 4px;">
                        <button onclick="updateAcquired(${deck.id}, ${c.id}, 1)">+</button>
                        <button onclick="updateAcquired(${deck.id}, ${c.id}, -1)">-</button>
                        <button class="btn-danger" onclick="removeCard(${deck.id}, ${c.id})">&times;</button>
                      </div>
                    </div>
                  `).join('')}
                </div>
              `}
            </div>
          </div>

          <!-- COLLAPSIBLE NOTES -->
          <div style="margin-top: 12px;">
            <div class="collapsible-header" onclick="toggleSection('notes_${deck.id}')">
              <h4>Suggested Augmentations / Tech Notes</h4>
              <span class="toggle-icon">${isNotesCollapsed ? '►' : '▼'}</span>
            </div>
            <div class="collapsible-body ${isNotesCollapsed ? 'collapsed' : ''}">
              <textarea rows="3" placeholder="e.g., Side in Droll & Lock Bird vs. search heavy matchups..." 
                onchange="updateAugmentations(${deck.id}, this.value)">${deck.augmentations || ''}</textarea>
            </div>
          </div>

          <button class="btn-danger" style="margin-top: 16px; width: 100%;" onclick="deleteDeck(${deck.id})">Delete Deck</button>
        `;
        container.appendChild(deckEl);
      });
    }

    renderDecks();
  </script>
</body>
</html>
